name: prototype-test-s3

services:
  prototype-redis:
    profiles: ["vertical"]
    image: redis:7-alpine
    container_name: prototype-dev-redis
    restart: "no"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:19079:6379"]
    volumes: ["prototype_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  prototype-minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: prototype-test-minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: prototype_test_access
      MINIO_ROOT_PASSWORD: prototype_test_secret_change_me
      MINIO_DEFAULT_BUCKETS: prototype-artifacts
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - prototype_minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  prototype-mongo:
    profiles: ["vertical"]
    image: mongo@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac
    container_name: prototype-test-mongo
    restart: "no"
    command: ["mongod", "--replSet", "prototype-rs", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:19017:27017"
    volumes:
      - prototype_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  prototype-mongo-init:
    profiles: ["vertical"]
    image: mongo@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac
    restart: "no"
    depends_on:
      prototype-mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "--host", "prototype-mongo:27017", "--quiet", "--eval"]
    command:
      - >-
        try {
          const status = rs.status();
          print(status.ok === 1 ? 'replica-set-ready' : 'replica-set-not-ready');
        }
        catch (error) {
          const result = rs.initiate({_id: 'prototype-rs', members: [{_id: 0, host: 'prototype-mongo:27017'}]});
          print(result.ok === 1 ? 'replica-set-initiated' : 'replica-set-init-failed');
        }

volumes:
  prototype_redis_data:
    name: prototype_redis_data
  prototype_minio_data:
    name: prototype_minio_data
  prototype_mongo_data:
    name: prototype_mongo_data
